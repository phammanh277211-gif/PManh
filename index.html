<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>Prime Shop Hack</title>
<style>
:root{
  --bg:#07070b;--card:#11121a;--card2:#171824;--red:#ff1744;--gold:#ffd54a;
  --text:#fff;--muted:#a9acb8;--line:rgba(255,255,255,.09);
}
*{box-sizing:border-box}
body{
  margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--text);
  background:radial-gradient(circle at 50% -10%,#4a0716 0,#14070c 35%,#07070b 70%);
  min-height:100vh;
}
header{
  padding:32px 16px 24px;text-align:center;border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5;background:rgba(7,7,11,.88);backdrop-filter:blur(14px)
}
.logo{font-size:30px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
.logo span{color:var(--red)}
.sub{color:var(--muted);margin-top:7px;font-size:13px}
.wrap{max-width:1100px;margin:auto;padding:22px 14px 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  border:1px solid var(--line);border-radius:20px;padding:20px;
  box-shadow:0 12px 35px rgba(0,0,0,.28);position:relative;overflow:hidden
}
.card:before{content:"";position:absolute;inset:0 auto auto 0;width:100%;height:2px;background:linear-gradient(90deg,var(--red),var(--gold))}
.badge{display:inline-block;color:#0b0800;background:var(--gold);font-size:10px;font-weight:900;padding:5px 9px;border-radius:999px;margin-bottom:10px}
h2{
  margin:4px 0 9px;font-size:24px;font-weight:950;letter-spacing:.8px;
  text-transform:uppercase;
  background:linear-gradient(90deg,#fff 0%,#ff5573 48%,#ffd54a 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 18px rgba(255,23,68,.18);
}
.price{
  display:inline-block;font-size:24px;font-weight:950;color:#fff;
  margin-bottom:14px;padding:7px 12px;border-radius:10px;
  background:linear-gradient(135deg,rgba(255,23,68,.16),rgba(255,213,74,.08));
  border:1px solid rgba(255,23,68,.20);
  box-shadow:inset 0 0 18px rgba(255,23,68,.06),0 5px 18px rgba(0,0,0,.18);
}
.desc{color:#d9dae1;line-height:1.65;font-size:14px;white-space:pre-line;min-height:145px}
.buy{
  width:100%;border:0;border-radius:12px;padding:13px 15px;margin-top:14px;
  background:linear-gradient(90deg,#ff1744,#ff3159);color:white;font-weight:900;font-size:15px;cursor:pointer
}
.buy:active{transform:scale(.98)}
footer{text-align:center;color:#777b88;font-size:12px;margin-top:30px}
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;
  align-items:center;justify-content:center;padding:16px
}
.modal{
  width:min(430px,100%);background:#11121a;border:1px solid #30313c;border-radius:20px;
  padding:20px;box-shadow:0 25px 80px #000
}
.modal h3{margin:0 40px 5px 0;font-size:22px}
.modal .muted{color:var(--muted);font-size:13px}
.close{float:right;border:0;background:#252632;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
.qty{display:flex;align-items:center;gap:12px;margin:20px 0}
.qty button{width:44px;height:44px;border:0;border-radius:10px;background:rgba(255,255,255,.08);color:white;font-size:22px;cursor:pointer;border:1px solid rgba(255,255,255,.10)}
.qty input{flex:1;text-align:center;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:10px;height:44px;font-size:18px}
.total{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.10);border-radius:12px;padding:13px;display:flex;justify-content:space-between;margin-bottom:12px}
.total strong{color:#ffd54a}
.qrbox{text-align:center;margin-top:15px}
.qrbox img{width:260px;max-width:100%;border-radius:14px;background:white;padding:8px}
.notice{font-size:12px;color:#9296a5;line-height:1.5;margin-top:10px}
.pay{display:none}
.toast{
 position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);
 background:#20222d;color:#fff;border:1px solid #383a47;padding:11px 15px;border-radius:12px;
 opacity:0;pointer-events:none;transition:.25s;z-index:50;font-size:13px
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:500px){.logo{font-size:25px}.card{padding:17px}.desc{min-height:auto}}

/* ===== PREMIUM ANIMATED UI ===== */
body{
  overflow-x:hidden;
  background:transparent;
}
.animated-bg{
  position:fixed;inset:0;z-index:-2;overflow:hidden;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,23,68,.20),transparent 28%),
    radial-gradient(circle at 85% 70%,rgba(116,35,255,.18),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(255,0,80,.12),transparent 35%),
    #04050a;
}
.animated-bg:before{
  content:"";position:absolute;inset:-50%;
  background:conic-gradient(from 0deg,transparent 0 22%,rgba(255,23,68,.08) 27%,transparent 34% 55%,rgba(255,213,74,.05) 61%,transparent 68%);
  animation:spinBg 18s linear infinite;
}
.grid-lines{
  position:absolute;inset:0;opacity:.13;
  background-image:
    linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);
  background-size:55px 55px;
  transform:perspective(600px) rotateX(58deg) scale(1.7);
  transform-origin:center bottom;
  animation:gridMove 8s linear infinite;
}
.orb{
  position:absolute;border-radius:50%;filter:blur(2px);
  box-shadow:0 0 70px 25px currentColor;
  opacity:.35;
}
.orb1{width:130px;height:130px;left:5%;top:18%;color:#ff1744;animation:float1 9s ease-in-out infinite}
.orb2{width:180px;height:180px;right:2%;top:42%;color:#7c32ff;animation:float2 12s ease-in-out infinite}
.orb3{width:100px;height:100px;left:45%;bottom:5%;color:#ff375f;animation:float3 10s ease-in-out infinite}
.particles{
  position:absolute;inset:0;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.7) 0 1px,transparent 1.5px),
    radial-gradient(circle,rgba(255,23,68,.6) 0 1px,transparent 1.5px);
  background-size:83px 97px,131px 113px;
  background-position:0 0,40px 30px;
  animation:particlesMove 16s linear infinite;
  opacity:.32;
}
header{
  width:100%;
  padding:25px 16px 21px;
  border-bottom:1px solid rgba(255,255,255,.10);
  background:rgba(4,5,10,.18);
  backdrop-filter:blur(12px);
  box-shadow:0 10px 35px rgba(0,0,0,.14);
}
.logo{
  position:relative;font-size:31px;letter-spacing:1.5px;
  text-shadow:0 0 25px rgba(255,23,68,.35);
}
.logo span{
  color:#ff1744;
  text-shadow:0 0 18px rgba(255,23,68,.8),0 0 40px rgba(255,23,68,.3);
}
.logo b{font-weight:900}
.live{
  display:inline-flex;align-items:center;gap:7px;margin-top:10px;
  padding:5px 10px;border:1px solid rgba(255,23,68,.25);
  border-radius:999px;background:rgba(255,23,68,.07);
  color:#ff6b84;font-size:10px;font-weight:900;letter-spacing:1px;
}
.live i{
  width:6px;height:6px;border-radius:50%;background:#ff1744;
  box-shadow:0 0 10px #ff1744;animation:blink 1s infinite;
}
.wrap{position:relative;z-index:1}
.card{
  border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  backdrop-filter:blur(12px);
  transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease;
}
.card:hover{
  transform:translateY(-7px);
  border-color:rgba(255,23,68,.42);
  box-shadow:0 20px 55px rgba(0,0,0,.48),0 0 35px rgba(255,23,68,.09);
}
.card:after{
  content:"";position:absolute;inset:-1px;border-radius:20px;pointer-events:none;
  background:linear-gradient(120deg,transparent 25%,rgba(255,255,255,.09),transparent 45%);
  transform:translateX(-120%);animation:shine 5s ease-in-out infinite;
}
.buy{
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:9px;
  min-height:50px;
  border:1px solid rgba(255,255,255,.16);
  background:linear-gradient(105deg,#ff1744 0%,#ff3159 45%,#ff5b72 100%);
  box-shadow:0 10px 30px rgba(255,23,68,.25),inset 0 1px 0 rgba(255,255,255,.22);
  transition:transform .22s ease,box-shadow .22s ease,filter .22s ease;
  letter-spacing:.8px;
}
.buy:before{
  content:"";
  position:absolute;top:0;left:-80%;width:45%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);
  transform:skewX(-20deg);
  animation:buttonShine 3.2s ease-in-out infinite;
}
.buy:after{
  content:"›";
  font-size:23px;line-height:1;
  transition:transform .22s ease;
}
.buy:hover{
  filter:brightness(1.1);
  box-shadow:0 14px 38px rgba(255,23,68,.40),0 0 22px rgba(255,23,68,.18);
  transform:translateY(-3px) scale(1.01);
}
.buy:hover:after{transform:translateX(4px)}
.buy:active{transform:translateY(0) scale(.985)}
@keyframes buttonShine{
  0%,55%{left:-80%}
  75%,100%{left:140%}
}
.badge{
  padding:6px 10px;border:1px solid rgba(255,255,255,.18);
  box-shadow:0 0 18px rgba(255,213,74,.15);
  letter-spacing:.7px;
}
.modal{
  background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.035));
  backdrop-filter:blur(22px);
  border-color:rgba(255,255,255,.12);
  animation:modalIn .28s ease-out;
}
@keyframes spinBg{to{transform:rotate(360deg)}}
@keyframes gridMove{from{background-position:0 0,0 0}to{background-position:0 55px,55px 0}}
@keyframes particlesMove{from{background-position:0 0,40px 30px}to{background-position:83px 97px,171px 143px}}
@keyframes float1{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,45px)}}
@keyframes float2{0%,100%{transform:translate(0,0)}50%{transform:translate(-65px,-55px)}}
@keyframes float3{0%,100%{transform:translate(0,0)}50%{transform:translate(45px,-35px)}}
@keyframes blink{50%{opacity:.25}}
@keyframes shine{0%,55%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}
@keyframes modalIn{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:scale(1) translateY(0)}}
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}

/* ===== PRODUCT NAME ANIMATION ===== */
.card h2{
  position:relative;
  display:block;
  overflow:hidden;
  background:linear-gradient(
    90deg,
    #ffffff 0%,
    #ff3159 25%,
    #ffd54a 50%,
    #ff3159 75%,
    #ffffff 100%
  );
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:
    productNameGradient 3.2s linear infinite,
    productNameFloat 2.4s ease-in-out infinite;
  transform-origin:center;
  filter:drop-shadow(0 0 8px rgba(255,23,68,.20));
}

.card h2::after{
  content:"";
  position:absolute;
  top:0;
  left:-70%;
  width:45%;
  height:100%;
  background:linear-gradient(
    100deg,
    transparent,
    rgba(255,255,255,.75),
    transparent
  );
  transform:skewX(-20deg);
  animation:productNameShine 2.8s ease-in-out infinite;
  pointer-events:none;
}

.card:hover h2{
  animation:
    productNameGradient 1.5s linear infinite,
    productNamePulse .8s ease-in-out infinite alternate;
  filter:
    drop-shadow(0 0 10px rgba(255,23,68,.45))
    drop-shadow(0 0 22px rgba(255,213,74,.18));
}

@keyframes productNameGradient{
  0%{background-position:0% 50%}
  100%{background-position:300% 50%}
}

@keyframes productNameFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-2px) scale(1.015)}
}

@keyframes productNamePulse{
  from{transform:scale(1)}
  to{transform:scale(1.035)}
}

@keyframes productNameShine{
  0%,45%{left:-70%}
  75%,100%{left:140%}
}

@media (prefers-reduced-motion:reduce){
  .card h2,
  .card h2::after{
    animation:none!important;
  }
}


/* ===== PREMIUM APP ENTRY LOADER ===== */
#appLoader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 42%,rgba(255,23,68,.18),transparent 30%),
    radial-gradient(circle at 20% 80%,rgba(124,50,255,.14),transparent 30%),
    #020307;
  overflow:hidden;
  transition:opacity .65s ease,visibility .65s ease;
}
#appLoader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-glow{
  position:absolute;
  width:280px;height:280px;border-radius:50%;
  background:rgba(255,23,68,.12);
  filter:blur(55px);
  animation:loaderGlow 2s ease-in-out infinite alternate;
}
.loader-content{
  position:relative;
  width:min(88%,390px);
  text-align:center;
  padding:34px 26px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:28px;
  background:linear-gradient(145deg,rgba(35,36,44,.72),rgba(4,5,9,.72));
  backdrop-filter:blur(22px);
  box-shadow:
    0 30px 100px rgba(0,0,0,.65),
    inset 0 1px 0 rgba(255,255,255,.13),
    0 0 45px rgba(255,23,68,.08);
}
.loader-title{
  margin:0;
  font-size:30px;
  font-weight:950;
  letter-spacing:1.5px;
  background:linear-gradient(90deg,#fff,#ff3159,#ffd54a,#fff);
  background-size:300% 100%;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:loaderTitle 2.4s linear infinite;
}
.loader-sub{
  margin:9px 0 22px;
  color:#a9acb8;
  font-size:12px;
  letter-spacing:2px;
  text-transform:uppercase;
}
.loader-bar{
  position:relative;
  height:8px;
  border-radius:99px;
  overflow:hidden;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 2px 5px rgba(0,0,0,.4);
}
.loader-progress{
  width:0%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,#ff1744,#ff5573,#ffd54a);
  box-shadow:0 0 18px rgba(255,23,68,.65);
  transition:width .08s linear;
}
.loader-progress:after{
  content:"";
  position:absolute;
  top:0;left:-30%;
  width:30%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);
  animation:loaderShine 1.2s linear infinite;
}
.loader-percent{
  margin-top:12px;
  font-size:13px;
  font-weight:900;
  color:#fff;
  letter-spacing:1px;
}
.loader-dots{
  margin-top:14px;
  display:flex;
  justify-content:center;
  gap:7px;
}
.loader-dots i{
  width:6px;height:6px;border-radius:50%;
  background:#ff3159;
  box-shadow:0 0 10px #ff3159;
  animation:loaderDot 1s ease-in-out infinite;
}
.loader-dots i:nth-child(2){animation-delay:.15s}
.loader-dots i:nth-child(3){animation-delay:.3s}

@keyframes loaderGlow{
  from{transform:scale(.85);opacity:.55}
  to{transform:scale(1.15);opacity:1}
}
@keyframes loaderTitle{
  0%{background-position:0% 50%}
  100%{background-position:300% 50%}
}
@keyframes loaderShine{
  from{left:-30%}
  to{left:130%}
}
@keyframes loaderDot{
  0%,100%{transform:translateY(0);opacity:.35}
  50%{transform:translateY(-4px);opacity:1}
}

</style>

<body>

<div id="appLoader" aria-label="Đang vào ứng dụng">
  <div class="loader-glow"></div>
  <div class="loader-content">
    <h1 class="loader-title">PRIME SHOP HACK</h1>
    <div class="loader-sub">Đang khởi động ứng dụng</div>
    <div class="loader-bar">
      <div class="loader-progress" id="loaderProgress"></div>
    </div>
    <div class="loader-percent" id="loaderPercent">0%</div>
    <div class="loader-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<div class="animated-bg" aria-hidden="true">
  <span class="orb orb1"></span>
  <span class="orb orb2"></span>
  <span class="orb orb3"></span>
  <span class="grid-lines"></span>
  <span class="particles"></span>
</div>

<header>
  <div class="brand-glow"></div>
  <div class="logo"><span>Prime</span> Shop <b>Hack</b></div>
  <div class="live"><i></i> SHOP ONLINE</div>
</header>

<main class="wrap">
  <div class="grid" id="products"></div>
  <footer>© 2026 Prime Shop Hack</footer>
</main>

<div class="overlay" id="modalOverlay">
  <div class="modal">
    <button class="close" onclick="closeModal()">×</button>
    <h3 id="modalName">Sản phẩm</h3>
    <div class="muted" id="modalPrice"></div>

    <div class="qty">
      <button onclick="changeQty(-1)">−</button>
      <input id="qty" type="number" min="1" value="1" oninput="updateTotal()">
      <button onclick="changeQty(1)">+</button>
    </div>

    <div class="total">
      <span>Tổng tiền</span><strong id="total">0 VNĐ</strong>
    </div>

    <button class="buy" onclick="createQR()">TẠO QR THANH TOÁN</button>

    <div class="qrbox" id="qrArea"></div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================
   CẤU HÌNH THANH TOÁN
   Đổi 3 dòng dưới thành thông tin nhận tiền của bạn.
   ========================= */
const BANK_ID = "TPBank";                 // Ví dụ: VCB, MB, ACB, BIDV...
const ACCOUNT_NO = "3832 0122 009";       // Số tài khoản nhận tiền
const ACCOUNT_NAME = "PHAM NGOC HUNG";     // Tên chủ tài khoản
const QR_TEMPLATE = "compact2";        // VietQR template

const products = [
  {
    name:"AIMLOCK", price:200000, badge:"HOT",
    desc:`Kéo là đỏ, không kéo là vàng
Hỗ trợ All Máy
Cài dễ, đi phòng bao ăn kèo
Antiband cân acc chính`
  },
  {
    name:"AIMHEAD", price:350000, badge:"BÁN CHẠY",
    desc:`Hỗ trợ nhẹ tâm bám đầu tốt
Bám chặt ở vùng đầu
Kéo nhẹ là đỏ
Cài siêu dễ, hỗ trợ All TBI IOS`
  },
  {
    name:"AIMDRAG", price:350000, badge:"AIM DRAG",
    desc:`Kéo nhẹ full đỏ, không kéo là vàng
Hỗ trợ cân kèo tiền
Antiband 100% cho acc game
Cài cực kì dễ và nhanh chóng`
  },
  {
    name:"AIMLOCK VIP", price:500000, badge:"VIP",
    desc:`Nhích nhẹ là full đỏ
Hỗ trợ cân check tâm không lộ
Cân kèo tiền, kaiser, gấu
Đặc biệt an toàn cho acc game
Cài dễ, sử dụng vĩnh viễn`
  },
  {
    name:"NHẸ TÂM VIP", price:100000, badge:"VIP",
    desc:`NHẸ TÂM
Nhẹ tâm, giảm lực cản iOS
Cân check tâm tốt
Tối ưu toàn bộ iOS`
  },
  {
    name:"AIMBODY", price:350000, badge:"HOT",
    desc:`Không cần kéo tâm vẫn full đỏ
Sử dụng vĩnh viễn
Cài siêu nhanh và dễ cài đặt
Hỗ trợ tất cả thiết bị iOS từ thấp đến cao`
  },
  {
    name:"AIM CÂN RANK", price:1000000, badge:"PREMIUM",
    desc:`Nhích nhẹ là full đỏ, không kéo vẫn vàng
An toàn tuyệt đối cho acc game
Hỗ trợ mọi dòng full thiết bị
Kéo rank, bắn phòng đều an toàn`
  }
];

const money = n => new Intl.NumberFormat("vi-VN").format(n) + " VNĐ";
const productsEl = document.getElementById("products");
let selected = null;

products.forEach((p,i)=>{
  const card = document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <div class="badge">${p.badge}</div>
    <h2>${p.name}</h2>
    <div class="price">${money(p.price)}</div>
    <div class="desc">${escapeHTML(p.desc)}</div>
    <button class="buy" onclick="openModal(${i})">MUA NGAY</button>
  `;
  productsEl.appendChild(card);
});

function escapeHTML(str){
  return str.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}

function openModal(index){
  selected=products[index];
  document.getElementById("modalName").textContent=selected.name;
  document.getElementById("modalPrice").textContent="Đơn giá: "+money(selected.price);
  document.getElementById("qty").value=1;
  document.getElementById("qrArea").innerHTML="";
  updateTotal();
  document.getElementById("modalOverlay").style.display="flex";
}

function closeModal(){
  document.getElementById("modalOverlay").style.display="none";
  selected=null;
}

function changeQty(delta){
  const input=document.getElementById("qty");
  input.value=Math.max(1,(parseInt(input.value)||1)+delta);
  updateTotal();
}

function updateTotal(){
  if(!selected)return;
  let q=Math.max(1,parseInt(document.getElementById("qty").value)||1);
  document.getElementById("qty").value=q;
  document.getElementById("total").textContent=money(selected.price*q);
}

function createQR(){
  if(!selected)return;
  const qty=Math.max(1,parseInt(document.getElementById("qty").value)||1);
  const amount=selected.price*qty;
  const addInfo=`PRIME ${selected.name} SL${qty}`;
  const note = encodeURIComponent(addInfo);

// VietQR: QR được tạo theo đúng sản phẩm, số lượng và tổng tiền
const qrUrl =
    `https://img.vietqr.io/image/${encodeURIComponent(BANK_ID)}-${encodeURIComponent(ACCOUNT_NO)}-${encodeURIComponent(QR_TEMPLATE)}.png`+
    `?amount=${amount}&addInfo=${note}&accountName=${encodeURIComponent(ACCOUNT_NAME)}`;

  document.getElementById("qrArea").innerHTML=`
    <img src="${qrUrl}" alt="QR thanh toán">
    <div class="notice"><b>${selected.name}</b> × ${qty}<br>Tổng: <b>${money(amount)}</b><br>${ACCOUNT_NAME} • ${ACCOUNT_NO}</div>
  `;
  showToast("Đã tạo QR thanh toán");
}

function showToast(text){
  const t=document.getElementById("toast");
  t.textContent=text;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2200);
}

document.getElementById("modalOverlay").addEventListener("click",e=>{
  if(e.target.id==="modalOverlay")closeModal();
});

/* ===== AUTO APP ENTRY ANIMATION ===== */
(function(){
  const loader = document.getElementById("appLoader");
  const progress = document.getElementById("loaderProgress");
  const percent = document.getElementById("loaderPercent");
  let value = 0;

  function tick(){
    value += value < 70 ? 3 : value < 92 ? 2 : 1;
    if(value > 100) value = 100;
    progress.style.width = value + "%";
    percent.textContent = value + "%";

    if(value < 100){
      setTimeout(tick, value < 70 ? 55 : 75);
    }else{
      setTimeout(()=>{
        loader.classList.add("hide");
        setTimeout(()=>loader.remove(),700);
      },420);
    }
  }

  window.addEventListener("load",()=>setTimeout(tick,120));
})();

</script>
</body>
</html>
